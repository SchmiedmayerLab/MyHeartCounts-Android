name: Static Analysis

on:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  actionlint:
    name: GitHub Actions Workflows
    uses: SchmiedmayerLab/.github/.github/workflows/actionlint.yml@feature/shared-android-workflows-and-caller-permissions
    permissions:
      contents: read

  dependency_review:
    name: Dependency Review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7
      - name: Review Dependency Changes
        uses: actions/dependency-review-action@v5

  reuse:
    name: REUSE Compliance
    uses: SchmiedmayerLab/.github/.github/workflows/reuse.yml@feature/shared-android-workflows-and-caller-permissions
    permissions:
      contents: read

  markdown_links:
    name: Markdown Links
    uses: SchmiedmayerLab/.github/.github/workflows/markdown-links.yml@feature/shared-android-workflows-and-caller-permissions
    permissions:
      contents: read
      pull-requests: read
