name: Google Play Bootstrap

on:
  workflow_dispatch:
    inputs:
      version:
        description: The semantic version for the first signed bundle.
        required: true
        default: 1.0.0
        type: string

concurrency:
  group: google-play-bootstrap
  cancel-in-progress: false

jobs:
  android:
    name: Android
    uses: ./.github/workflows/build-test-analyze.yml
    permissions:
      actions: read
      contents: read
      packages: read
      security-events: write
    secrets: inherit

  signed_bundle:
    name: Signed Bootstrap Bundle
    needs: android
    uses: SchmiedmayerLab/.github/.github/workflows/android-google-play-bootstrap.yml@feature/shared-android-workflows-and-caller-permissions
    permissions:
      contents: read
    secrets: inherit
    with:
      version: ${{ inputs.version }}
