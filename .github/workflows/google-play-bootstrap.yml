name: Google Play Bootstrap

on:
  workflow_dispatch:
    inputs:
      version:
        description: The semantic version for the first signed bundle.
        required: true
        default: 1.0.0
        type: string

concurrency:
  group: google-play-bootstrap
  cancel-in-progress: false

jobs:
  android:
    name: Android
    uses: ./.github/workflows/build-test-analyze.yml
    permissions:
      actions: read
      contents: read
      packages: read
      security-events: write
    secrets: inherit

  signed_bundle:
    name: Signed Bootstrap Bundle
    needs:
      - android
    environment: staging
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7
      - name: Set Up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
      - name: Set Up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true
      - name: Write Upload Keystore
        env:
          KEY_STORE: ${{ secrets.KEY_STORE }}
        run: |
          install -d -m 700 deployment/secrets
          printf '%s' "$KEY_STORE" | base64 --decode > deployment/secrets/upload-keystore.jks
          chmod 600 deployment/secrets/upload-keystore.jks
      - name: Build Signed Bundle
        env:
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: >-
          bundle exec fastlane bootstrap_bundle
          applicationid:"${{ vars.APP_IDENTIFIER }}"
          versioncode:1
          versionname:"${{ inputs.version }}"
      - name: Upload Signed Bundle Artifact
        uses: actions/upload-artifact@v7
        with:
          name: my-heart-counts-${{ inputs.version }}-bootstrap
          path: |
            myheartcounts/build/outputs/bundle/release/myheartcounts-release.aab
            myheartcounts/build/outputs/mapping/release/mapping.txt
          if-no-files-found: error
          retention-days: 14
