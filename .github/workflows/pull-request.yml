name: Pull Request Checks

on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review
      - converted_to_draft
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  scoped_health_fhir:
    if: github.event_name == 'pull_request' && github.event.pull_request.draft == true
    name: Scoped Health/FHIR Development
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Set Up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle
      - name: Test Health Collection and FHIR Conversion
        run: >-
          ./gradlew
          :health:testDebugUnitTest
          :health-fhir:testDebugUnitTest
          :health-fhir:lintDebug
          --console=plain

  fhir_conformance:
    name: FHIR R4 Conformance
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Checkout Grove FHIR Contract
        uses: actions/checkout@v7
        with:
          repository: SchmiedmayerLab/grove-fhir
          # Pinned so a contract change is a visible edit here, not a silent CI drift.
          # Development verification follows the exact grove-fhir commit on main.
          ref: 54d977149c038b7487614bbe30fbc8f8ebf541d0
          path: .grove-fhir
          persist-credentials: false
      - name: Record the Exact Grove FHIR Revision
        run: git -C .grove-fhir rev-parse --verify HEAD
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: .grove-fhir/package-lock.json
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13.15"
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21.0.10+7.0.LTS"
          cache: gradle
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3.12"
          bundler-cache: false
      - name: Select the Locked Bundler
        run: gem install bundler -v 4.0.16 --no-document
      - name: Build the Applicable Grove FHIR Packages
        working-directory: .grove-fhir
        run: |
          npm ci
          ./Scripts/build-guides.sh mobile health-connect
      - name: Validate Emitted Health Connect Resources
        run: >-
          ./Scripts/validate-health-connect-fhir-conformance.sh
          --grove-fhir .grove-fhir
          --mobile-package .grove-fhir/mobile/output/package.tgz
          --health-connect-package .grove-fhir/health-connect/output/package.tgz
          --validator-jar .grove-fhir/.build/fhir-tools/validator_cli.jar

  android:
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    name: Android
    uses: SchmiedmayerLab/.github/.github/workflows/android.yml@v0.5
    permissions:
      actions: read
      contents: read
      packages: read
      security-events: write
    secrets: inherit
    with:
      submodules: 'true'
      swiftversion: 'latest'
      swiftcachepaths: '**/build/studyBundle*'

  release_bundle:
    name: Signed Release Bundle
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    needs:
      - android
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7
        with:
          submodules: true
      - name: Set Up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle
      - name: Set Up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true
      - name: Set Up Swift
        uses: SwiftyLab/setup-swift@v1
        with:
          swift-version: latest
      - name: Determine Swift Cache Key
        id: swiftcache
        shell: bash
        run: echo "submodules=$(git submodule status --recursive | git hash-object --stdin | cut -c1-16)" >> "$GITHUB_OUTPUT"
      - name: Cache Swift Build State
        uses: actions/cache@v6
        with:
          path: |
            ~/.cache/org.swift.swiftpm
            **/build/studyBundle*
          key: swiftpm-${{ runner.os }}-latest-${{ steps.swiftcache.outputs.submodules }}
          restore-keys: |
            swiftpm-${{ runner.os }}-latest-
      - name: Generate Disposable CI Signing Key
        env:
          KEY_ALIAS: ci-myheartcounts-upload
          KEY_PASSWORD: ci-only-password
        run: |
          install -d -m 700 deployment/secrets
          keytool -genkeypair \
            -alias "$KEY_ALIAS" \
            -keyalg RSA \
            -keysize 2048 \
            -sigalg SHA256withRSA \
            -validity 1 \
            -dname "CN=My Heart Counts CI Upload Key, OU=SchmiedmayerLab, O=Stanford University, C=US" \
            -storetype PKCS12 \
            -keystore deployment/secrets/upload-keystore.jks \
            -storepass:env KEY_PASSWORD \
            -keypass:env KEY_PASSWORD \
            -noprompt
      - name: Build Signed Release Bundle
        env:
          KEY_ALIAS: ci-myheartcounts-upload
          KEY_PASSWORD: ci-only-password
        run: >-
          bundle exec fastlane bootstrap_bundle
          applicationid:edu.stanford.myheartcounts
          versioncode:1
          versionname:1.0.0
