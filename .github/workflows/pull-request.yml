name: Pull Request Checks

on:
  pull_request:
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    name: Android
    uses: ./.github/workflows/build-test-analyze.yml
    permissions:
      actions: read
      contents: read
      packages: read
      security-events: write
    secrets: inherit

  release_bundle:
    name: Signed Release Bundle
    needs:
      - android
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7
      - name: Set Up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle
      - name: Set Up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true
      - name: Generate Disposable CI Signing Key
        env:
          KEY_ALIAS: ci-myheartcounts-upload
          KEY_PASSWORD: ci-only-password
        run: |
          install -d -m 700 deployment/secrets
          keytool -genkeypair \
            -alias "$KEY_ALIAS" \
            -keyalg RSA \
            -keysize 2048 \
            -sigalg SHA256withRSA \
            -validity 1 \
            -dname "CN=My Heart Counts CI Upload Key, OU=SchmiedmayerLab, O=Stanford University, C=US" \
            -storetype PKCS12 \
            -keystore deployment/secrets/upload-keystore.jks \
            -storepass:env KEY_PASSWORD \
            -keypass:env KEY_PASSWORD \
            -noprompt
      - name: Build Signed Release Bundle
        env:
          KEY_ALIAS: ci-myheartcounts-upload
          KEY_PASSWORD: ci-only-password
        run: >-
          bundle exec fastlane bootstrap_bundle
          applicationid:edu.stanford.myheartcounts
          versioncode:1
          versionname:1.0.0
