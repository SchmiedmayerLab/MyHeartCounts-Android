name: Android Build, Test, and Analysis

on:
  workflow_dispatch:
  workflow_call:

jobs:
  android:
    name: Android
    # Pins the feature revision until the .github repository tags v0.6.
    uses: SchmiedmayerLab/.github/.github/workflows/android.yml@128c59fd37f941cb0d411d4a8231fb80525e47b8
    permissions:
      actions: read
      contents: read
      packages: read
      security-events: write
    secrets: inherit
    with:
      submodules: 'true'
      swiftversion: 'latest'
      swiftcachepaths: '**/build/studyBundle*'
