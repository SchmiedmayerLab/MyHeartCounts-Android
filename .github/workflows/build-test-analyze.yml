name: Android Build, Test, and Analysis

on:
  workflow_dispatch:
  workflow_call:

jobs:
  detekt:
    name: Detekt
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7
      - name: Set Up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: gradle
      - name: Configure Gradle
        uses: gradle/actions/setup-gradle@v6.2.0
      - name: Run Detekt
        run: ./gradlew detekt --no-daemon
      - name: Upload Detekt Reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: detekt-reports
          path: '**/build/reports/detekt/**'
          if-no-files-found: warn
          retention-days: 14
  unit_tests:
    name: Unit Tests and CodeQL
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      security-events: write
      packages: read
      actions: read
      contents: read
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7
      - name: Set Up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: gradle
      - name: Set Up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler-cache: true
      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4.37.4
        with:
          languages: java-kotlin
          build-mode: manual
      - name: Run Unit Tests
        run: bundle exec fastlane test
      - name: Upload Test Reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: unit-test-reports
          if-no-files-found: ignore
          retention-days: 14
          path: |
            **/build/reports/tests/**
            **/build/test-results/**
      - name: Stop Gradle Daemon
        run: ./gradlew --stop
      - name: Analyze with CodeQL
        uses: github/codeql-action/analyze@v4.37.4
        with:
          category: "/language:java-kotlin"
      - name: Upload Unit Test Coverage
        uses: codecov/codecov-action@v7
        with:
          files: '**/build/reports/jacoco/jacocoCoverageReport/jacocoCoverageReport.xml'
          flags: unittests
          name: codecov-coverage
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}
  screenshot_tests:
    name: Screenshot Tests
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7
        with:
          # Baselines are stored in git LFS; without this the checkout yields pointer
          # files and verification fails while reading them.
          lfs: true
      - name: Set Up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: gradle
      - name: Set Up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler-cache: true
      - name: Verify Screenshots
        run: bundle exec fastlane screenshotTests
      - name: Upload Screenshot Failures
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: screenshot-failures
          if-no-files-found: ignore
          retention-days: 14
          path: |
            **/build/paparazzi/failures/**
            **/build/reports/tests/**
            **/build/test-results/**
      - name: Stop Gradle Daemon
        run: ./gradlew --stop
  instrumented_tests:
    name: Instrumented Tests (API ${{ matrix.api-level }}, ${{ matrix.target }})
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        api-level: [31, 34]
        profile: ["pixel_6"]
        target: ["default", "google_apis"]
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7
      - name: Set Up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: gradle
      - name: Set Up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler-cache: true
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Configure Gradle
        uses: gradle/actions/setup-gradle@v6.2.0
      - name: Restore AVD Cache
        uses: actions/cache@v6
        id: avd-cache
        with:
          path: |
            ~/.android/avd/*
            ~/.android/adb*
          key: avd-v5-${{ matrix.api-level }}-${{ matrix.target }}-${{ matrix.profile }}
      - name: Create and Cache AVD
        if: steps.avd-cache.outputs.cache-hit != 'true'
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api-level }}
          target: ${{ matrix.target }}
          profile: ${{ matrix.profile }}
          arch: x86_64
          ram-size: 1536M
          heap-size: 256M
          disk-size: 1024M
          force-avd-creation: false
          pre-emulator-launch-script: >-
            sed -i
            's/^disk.dataPartition.size=.*/disk.dataPartition.size=1024M/'
            /home/runner/.android/avd/test.avd/config.ini
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: false
          script: |
            sdkmanager --list
            avdmanager list devices
      - name: Build Instrumented Test Artifacts
        run: >-
          ./gradlew
          assembleDebug
          assembleDebugAndroidTest
          --no-daemon
          --max-workers=2
      - name: Run Instrumented Tests
        uses: reactivecircus/android-emulator-runner@v2
        env:
          GRADLE_OPTS: >-
            -Dorg.gradle.jvmargs=-Xmx2048m
            -Dorg.gradle.workers.max=2
            -Dkotlin.daemon.jvmargs=-Xmx1024m
        with:
          api-level: ${{ matrix.api-level }}
          target: ${{ matrix.target }}
          profile: ${{ matrix.profile }}
          arch: x86_64
          ram-size: 1536M
          heap-size: 256M
          disk-size: 1024M
          force-avd-creation: false
          pre-emulator-launch-script: >-
            sed -i
            's/^disk.dataPartition.size=.*/disk.dataPartition.size=1024M/'
            /home/runner/.android/avd/test.avd/config.ini
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: bundle exec fastlane connectedCheck
      - name: Upload Instrumented Test Coverage
        uses: codecov/codecov-action@v7
        with:
          files: '**/build/reports/coverage/androidTest/debug/connected/index.html'
          flags: uitests
          name: codecov-coverage
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}
