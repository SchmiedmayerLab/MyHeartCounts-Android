name: Android Build, Test, and Analysis

on:
  workflow_dispatch:
  workflow_call:

jobs:
  android:
    name: Android
    # Tracks the feature branch until the .github repository tags v0.6.
    uses: SchmiedmayerLab/.github/.github/workflows/android.yml@feature/android-swift-toolchain
    permissions:
      actions: read
      contents: read
      packages: read
      security-events: write
    secrets: inherit
    with:
      submodules: 'true'
      swiftversion: 'latest'
