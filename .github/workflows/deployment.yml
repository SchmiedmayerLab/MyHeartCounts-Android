name: Google Play Deployment

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      environment:
        description: The Google Play track to publish to, and the environment holding its credentials.
        required: true
        default: internal
        type: choice
        options:
          - production
          - internal
      version:
        description: The semantic version to deploy, for example 1.2.3.
        required: true
        type: string
      releasenotes:
        description: The release notes to publish on Google Play.
        required: false
        type: string
  workflow_call:
    inputs:
      environment:
        description: The Google Play track to publish to, and the environment holding its credentials.
        required: false
        type: string
        default: internal
      version:
        description: The semantic version to deploy.
        required: true
        type: string
      releasenotes:
        description: The release notes to publish on Google Play.
        required: false
        type: string

concurrency:
  group: deployment-${{ inputs.environment || 'internal' }}
  cancel-in-progress: false

jobs:
  android:
    name: Android
    uses: ./.github/workflows/build-test-analyze.yml
    permissions:
      actions: read
      contents: read
      packages: read
      security-events: write
    secrets: inherit

  google_play:
    name: Google Play Upload
    if: vars.PLAY_DEPLOYMENT_ENABLED == 'true'
    needs: android
    uses: SchmiedmayerLab/.github/.github/workflows/android-google-play.yml@feature/shared-android-workflows-and-caller-permissions
    permissions:
      contents: write
    secrets: inherit
    with:
      environment: ${{ inputs.environment || 'internal' }}
      version: ${{ inputs.version }}
      releasenotes: ${{ inputs.releasenotes }}
      recordversion: true
