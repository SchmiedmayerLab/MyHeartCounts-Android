name: Google Play Deployment

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      environment:
        description: The GitHub deployment environment.
        required: true
        default: staging
        type: choice
        options:
          - production
          - staging
      version:
        description: The semantic version to deploy, for example 1.2.3.
        required: true
        type: string
      releasenotes:
        description: The release notes to publish on Google Play.
        required: false
        type: string
  workflow_call:
    inputs:
      environment:
        description: The GitHub deployment environment.
        required: false
        type: string
        default: staging
      version:
        description: The semantic version to deploy.
        required: true
        type: string
      releasenotes:
        description: The release notes to publish on Google Play.
        required: false
        type: string

concurrency:
  group: deployment-${{ inputs.environment || 'staging' }}
  cancel-in-progress: false

jobs:
  configuration:
    name: Deployment Configuration
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      environment: ${{ steps.configuration.outputs.environment }}
      track: ${{ steps.configuration.outputs.track }}
      version: ${{ steps.configuration.outputs.version }}
    steps:
      - name: Checkout Repository and Tags
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Determine Environment and Version
        id: configuration
        env:
          REQUESTED_ENVIRONMENT: ${{ inputs.environment }}
          REQUESTED_VERSION: ${{ inputs.version }}
        run: |
          environment="${REQUESTED_ENVIRONMENT:-staging}"
          version="${REQUESTED_VERSION}"

          case "$environment" in
            staging)
              track="internal"
              ;;
            production)
              track="production"
              ;;
            *)
              echo "Environment must be staging or production." >&2
              exit 1
              ;;
          esac

          if [[ -z "$version" ]]; then
            declared_version="$(sed -n 's/^myHeartCounts\.versionName=//p' gradle.properties)"
            if [[ ! "$declared_version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              echo "myHeartCounts.versionName must use semantic versioning." >&2
              exit 1
            fi

            latest_tag="$(git tag --list | awk '/^[0-9]+\.[0-9]+\.[0-9]+$/' | sort -V | tail -n 1)"
            if [[ -z "$latest_tag" ]]; then
              version="$declared_version"
            else
              IFS='.' read -r major minor patch <<< "$latest_tag"
              tag_version="${major}.${minor}.$((patch + 1))"
              version="$(printf '%s\n%s\n' "$declared_version" "$tag_version" | sort -V | tail -n 1)"
            fi
          fi

          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Version must use semantic versioning, for example 1.2.3." >&2
            exit 1
          fi

          {
            echo "environment=$environment"
            echo "track=$track"
            echo "version=$version"
          } >> "$GITHUB_OUTPUT"

  android:
    name: Android
    uses: ./.github/workflows/build-test-analyze.yml
    permissions:
      actions: read
      contents: read
      packages: read
      security-events: write
    secrets: inherit

  google_play:
    name: Google Play Upload
    if: vars.PLAY_DEPLOYMENT_ENABLED == 'true'
    runs-on: ubuntu-latest
    needs:
      - configuration
      - android
    environment: ${{ needs.configuration.outputs.environment }}
    permissions:
      contents: read
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7
      - name: Set Up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle
      - name: Set Up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true
      - name: Write Upload Keystore
        env:
          KEY_STORE: ${{ secrets.KEY_STORE }}
        run: |
          install -d -m 700 deployment/secrets
          printf '%s' "$KEY_STORE" | base64 --decode > deployment/secrets/upload-keystore.jks
          chmod 600 deployment/secrets/upload-keystore.jks
      - name: Build and Deploy
        env:
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          RELEASE_NOTES: ${{ inputs.releasenotes }}
          SERVICE_ACCOUNT_JSON_KEY: ${{ secrets.SERVICE_ACCOUNT_JSON_KEY }}
        run: >-
          bundle exec fastlane deployment
          environment:"${{ needs.configuration.outputs.track }}"
          applicationid:"${{ vars.APP_IDENTIFIER }}"
          versionname:"${{ needs.configuration.outputs.version }}"
