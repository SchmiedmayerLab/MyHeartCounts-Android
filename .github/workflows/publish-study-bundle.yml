name: Publish Study Bundle

# Exports the study bundle from MyHeartCounts-StudyDefinitions, publishes it as a release asset,
# and opens the pull request that repoints the study bundle pin at it.
#
# The export compiles Swift, so this is the one workflow that needs macOS. Everything that
# assembles the app consumes the published archive and runs on Linux.

on:
  workflow_dispatch:
    inputs:
      ref:
        description: 'Tag, branch or commit of MyHeartCounts-StudyDefinitions to export'
        required: true
        default: 'main'
        type: string
      xcode_version:
        description: 'Xcode version on the runner image to export with'
        required: false
        default: '26.4'
        type: string

concurrency:
  group: publish-study-bundle
  cancel-in-progress: false

env:
  REF: ${{ inputs.ref }}

jobs:
  export:
    name: Export and Publish
    runs-on: macos-26
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Read the Study Bundle Properties
        run: |
          # gradle.properties is the single source of truth, shared with the Gradle build and the app.
          while IFS='=' read -r key value; do
            case "$key" in
              myHeartCounts.studyBundle.name) echo "BUNDLE_NAME=$value" >> "$GITHUB_ENV" ;;
              myHeartCounts.studyBundle.pinFile) echo "PIN_FILE=$value" >> "$GITHUB_ENV" ;;
              myHeartCounts.studyBundle.sourceRepository) echo "SOURCE_REPOSITORY=$value" >> "$GITHUB_ENV" ;;
              myHeartCounts.studyBundle.releaseTagPrefix) echo "RELEASE_TAG_PREFIX=$value" >> "$GITHUB_ENV" ;;
            esac
          done < gradle.properties

      - name: Checkout Study Definitions
        run: |
          git init --quiet study-definitions
          git -C study-definitions remote add origin "https://github.com/${SOURCE_REPOSITORY}.git"
          git -C study-definitions fetch --quiet --depth 1 origin "$REF"
          git -C study-definitions checkout --quiet FETCH_HEAD
          echo "SOURCE_COMMIT=$(git -C study-definitions rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: ${{ inputs.xcode_version }}

      - name: Export Study Bundle
        working-directory: study-definitions
        run: |
          mkdir -p "$RUNNER_TEMP/export"
          swift run MHCStudyDefinitionExporterCLI export --format package "$RUNNER_TEMP/export"

      - name: Archive Study Bundle
        run: |
          cd "$RUNNER_TEMP/export"
          zip -qr "$GITHUB_WORKSPACE/$BUNDLE_NAME.zip" "$BUNDLE_NAME"

      - name: Describe the Archive
        run: |
          definition="$RUNNER_TEMP/export/$BUNDLE_NAME/definition.json"
          {
            echo "STUDY_REVISION=$(python3 -c "import json,sys; print(json.load(open(sys.argv[1]))['studyRevision'])" "$definition")"
            echo "SCHEMA_VERSION=$(python3 -c "import json,sys; print(json.load(open(sys.argv[1]))['schemaVersion'])" "$definition")"
            echo "RELEASE_TAG=${RELEASE_TAG_PREFIX}$(printf '%s' "$REF" | tr '/' '-')"
          } >> "$GITHUB_ENV"

      - name: Resolve the Existing Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          published=""
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            published=$(gh release view "$RELEASE_TAG" --json body -q .body \
              | sed -n 's/^<!-- source-commit: \([0-9a-f]*\) -->$/\1/p' | head -1)
          fi

          if [ "$published" = "$SOURCE_COMMIT" ]; then
            echo "::notice::$RELEASE_TAG already holds $SOURCE_COMMIT; reusing its archive."
            rm -f "$BUNDLE_NAME.zip"
            gh release download "$RELEASE_TAG" --pattern "$BUNDLE_NAME.zip"
          fi
          echo "SHA256=$(shasum -a 256 "$BUNDLE_NAME.zip" | cut -d' ' -f1)" >> "$GITHUB_ENV"

      - name: Compose the Release Notes
        run: |
          python3 - <<'PYTHON'
          import json
          import os

          environment = os.environ
          repository = environment["GITHUB_REPOSITORY"]
          source = environment["SOURCE_REPOSITORY"]
          commit = environment["SOURCE_COMMIT"]
          tag = environment["RELEASE_TAG"]
          name = environment["BUNDLE_NAME"]

          pin = {
              "comment": (
                  "Pins the study bundle the app packages. Produced by "
                  ".github/workflows/publish-study-bundle.yml; update by running that workflow and "
                  "copying the snippet from the release it publishes."
              ),
              "source": {
                  "repository": f"https://github.com/{source}",
                  "ref": environment["REF"],
                  "commit": commit,
              },
              "bundle": {
                  "schemaVersion": environment["SCHEMA_VERSION"],
                  "studyRevision": int(environment["STUDY_REVISION"]),
                  "url": f"https://github.com/{repository}/releases/download/{tag}/{name}.zip",
                  "sha256": environment["SHA256"],
              },
          }

          notes = f"""Study revision `{environment['STUDY_REVISION']}`, schema `{environment['SCHEMA_VERSION']}`.

          | | |
          |---|---|
          | Source | [`{source}`](https://github.com/{source}) |
          | Ref | `{environment['REF']}` |
          | Commit | [`{commit}`](https://github.com/{source}/commit/{commit}) |
          | Archive | `sha256:{environment['SHA256']}` |

          ## Pin

          Copy into `{environment['PIN_FILE']}`:

          ```json
          {json.dumps(pin, indent=2)}
          ```

          <!-- source-commit: {commit} -->
          """

          with open(os.path.join(environment["RUNNER_TEMP"], "notes.md"), "w") as file:
              file.write(notes)
          PYTHON

      - name: Publish Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          notes="$RUNNER_TEMP/notes.md"
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release edit "$RELEASE_TAG" --title "Study bundle $REF" --notes-file "$notes"
            gh release upload "$RELEASE_TAG" "$BUNDLE_NAME.zip" --clobber
          else
            gh release create "$RELEASE_TAG" "$BUNDLE_NAME.zip" \
              --title "Study bundle $REF" --notes-file "$notes"
          fi

      - name: Update the Pin
        run: |
          python3 - <<'PYTHON'
          import json
          import os

          repository = os.environ["GITHUB_REPOSITORY"]
          pin = {
              "comment": (
                  "Pins the study bundle the app packages. Produced by "
                  ".github/workflows/publish-study-bundle.yml; update by running that workflow, "
                  "which publishes a release and opens the pull request that updates this file."
              ),
              "source": {
                  "repository": f"https://github.com/{os.environ['SOURCE_REPOSITORY']}",
                  "ref": os.environ["REF"],
                  "commit": os.environ["SOURCE_COMMIT"],
              },
              "bundle": {
                  "schemaVersion": os.environ["SCHEMA_VERSION"],
                  "studyRevision": int(os.environ["STUDY_REVISION"]),
                  "url": (
                      f"https://github.com/{repository}/releases/download/"
                      f"{os.environ['RELEASE_TAG']}/{os.environ['BUNDLE_NAME']}.zip"
                  ),
                  "sha256": os.environ["SHA256"],
              },
          }
          with open(environment["PIN_FILE"], "w") as file:
              json.dump(pin, file, indent=2)
              file.write("\n")
          PYTHON

      - name: Open Pull Request
        continue-on-error: true
        uses: peter-evans/create-pull-request@v7
        with:
          branch: study-bundle/${{ env.RELEASE_TAG }}
          title: 'Update the study bundle to ${{ env.REF }}'
          commit-message: 'Update the study bundle to ${{ env.REF }}'
          body: |
            Repoints the study bundle pin at `${{ env.RELEASE_TAG }}`.

            - study revision `${{ env.STUDY_REVISION }}`, schema `${{ env.SCHEMA_VERSION }}`
            - exported from `${{ env.SOURCE_REPOSITORY }}@${{ env.SOURCE_COMMIT }}`
          add-paths: ${{ env.PIN_FILE }}
