version: 2

multi-ecosystem-groups:
  weekly-dependencies:
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: America/Los_Angeles

updates:
  - package-ecosystem: gradle
    directory: /
    patterns:
      - "*"
    multi-ecosystem-group: "weekly-dependencies"
    ignore:
      # The CodeQL Kotlin extractor supports Kotlin up to 2.4.0 and fails the Kotlin
      # compilation on anything newer. Lift this cap once CodeQL catches up.
      - dependency-name: "org.jetbrains.kotlin*"
        versions: [">2.4.0"]

  - package-ecosystem: bundler
    directory: /
    patterns:
      - "*"
    multi-ecosystem-group: "weekly-dependencies"

  - package-ecosystem: github-actions
    directory: /
    patterns:
      - "*"
    multi-ecosystem-group: "weekly-dependencies"
