# Please keep [bundles] block sorted. Select all items and in Android Studio `Edit > Sort Lines`
[bundles]
integration-testing = ["androidx-espresso-core", "androidx-junit", "androidx-test-core", "androidx-test-runner", "google-truth", "coroutines-test"]
